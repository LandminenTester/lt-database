name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet test tests/Bundle.Tests -c Release
      - run: dotnet build sv/sv.csproj -c Release
      - run: dotnet build examples/consumer/consumer.csproj -c Release
      - run: dotnet build examples/smoke/sv/sv.csproj -c Release
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: lt-database
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lt-database
          path: release
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "lt-database ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
