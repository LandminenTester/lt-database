[General]
description = "Database connector for BlackICE servers: other server bundles call its exports to declare tables and to read, write, update and delete data in a PostgreSQL, MySQL or MongoDB database through the external lt-database-api."
author = "LandminenTester | Landminen Tester"
version = "0.1.0"

[Scripting]
server_blob = "sv.wasm"
enable_vfs = true

# The connector may only talk to your lt-database-api. Replace the host name; the API must be reachable over https.
[Networking]
allowed = ["db.example.com"]

[Meta]
config_version = "alpha_playtest"
